<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>RebornBOOST — Otimização de PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --fg:#fff; --muted:#9a9a9a; --line:rgba(255,255,255,.14);
  --card:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); --glow:rgba(255,255,255,.35);
  --display:"Space Grotesk","Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit;margin:0}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--body);
  display:flex;justify-content:center;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 40% at 50% 0%,rgba(255,255,255,.10),transparent 70%),
             radial-gradient(50% 30% at 50% 100%,rgba(255,255,255,.07),transparent 70%)}
body::after,html::after{content:"";position:fixed;border-radius:50%;pointer-events:none;border:1px solid rgba(255,255,255,.10)}
body::after{width:520px;height:520px;left:-340px;top:6%;box-shadow:inset -18px 0 40px -20px rgba(255,255,255,.2)}
html::after{width:420px;height:420px;right:-300px;bottom:8%;box-shadow:inset 16px 0 36px -20px rgba(255,255,255,.16)}
main{position:relative;z-index:1;width:100%;max-width:440px;padding:clamp(18px,4vh,40px) 20px 24px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:min(46vw,21vh,220px);min-width:120px;aspect-ratio:1;display:block;
  -webkit-mask-image:radial-gradient(circle,#000 52%,transparent 71%);mask-image:radial-gradient(circle,#000 52%,transparent 71%)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(26px,7.4vw,32px);letter-spacing:.14em;padding-left:.14em;line-height:1.1;margin-top:4px;text-transform:uppercase}
h1 span{color:var(--muted);font-weight:500}
.eyebrow{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.eyebrow::before,.eyebrow::after{content:"";width:28px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55))}
.eyebrow::after{transform:scaleX(-1)}
.sub{margin-top:8px;font-size:14px;line-height:1.5;color:var(--muted);max-width:32ch}
.steps{list-style:none;padding:0;display:grid;grid-template-columns:repeat(3,1fr);width:100%;margin-top:18px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.steps li{padding:10px 4px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#d8d8d8;display:flex;flex-direction:column;gap:4px;align-items:center}
.steps li+li{border-left:1px solid var(--line)}
.steps i{font-style:normal;font-family:var(--display);font-size:11px;color:var(--muted);letter-spacing:.12em}
.links{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:22px}
.btn{display:flex;align-items:center;gap:14px;width:100%;min-height:68px;padding:12px 16px 12px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--fg);text-decoration:none;text-align:left;
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease;-webkit-tap-highlight-color:transparent}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:rgba(255,255,255,.45);box-shadow:0 0 28px -6px var(--glow);outline:none}
.btn:active{transform:translateY(0)}
.ico{flex:none;width:42px;height:42px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line)}
.ico svg{width:22px;height:22px;fill:currentColor}
.txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.txt b{font-family:var(--display);font-weight:700;font-size:16px;line-height:1.2}
.txt small{font-size:12.5px;color:var(--muted);line-height:1.3}
.arrow{flex:none;width:18px;height:18px;opacity:.55;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:#fff;color:#000;border-color:#fff}
.btn.primary .ico{border-color:rgba(0,0,0,.2)}
.btn.primary .txt small{color:#4a4a4a}
.btn.primary:hover,.btn.primary:focus-visible{box-shadow:0 0 36px -4px rgba(255,255,255,.6)}
footer{margin-top:20px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6b6b6b}
.links .hero{order:-1;min-height:84px;padding:12px 18px 12px 16px;box-shadow:0 0 40px -10px rgba(255,255,255,.5);animation:pulse 3.2s ease-in-out infinite}
.links .hero:hover,.links .hero:focus-visible{animation:none;box-shadow:0 0 56px -4px rgba(255,255,255,.75)}
.hero .ico{width:48px;height:48px;border-radius:12px}
.hero .ico svg{width:26px;height:26px}
.hero .txt{gap:3px}
.hero .txt b{font-size:20px}
.hero .txt small{font-size:13px}
.tag{font-style:normal;font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#555}
#whatsapp{min-height:56px}
@keyframes pulse{50%{box-shadow:0 0 58px -4px rgba(255,255,255,.7)}}
@media (min-width:768px){main{padding-top:72px;max-width:480px}}
@media (prefers-reduced-motion:reduce){.btn,.links .hero{transition:none;animation:none}}
.bgfx{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;object-position:50% 0;filter:grayscale(1) contrast(1.05) blur(8px);transform:scale(1.05);opacity:.5;pointer-events:none;z-index:0}
.bgshade{position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(180deg,rgba(0,0,0,.2) 0%,rgba(0,0,0,.55) 40%,#000 85%)}
.bgwide{display:none;position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%;filter:blur(10px);transform:scale(1.05);pointer-events:none;z-index:0}
.logo{height:auto}
@media (min-width:1000px) and (min-aspect-ratio:8/5){
.bgfx,.bgfill{display:none}
.bgwide{display:block}
.bgshade{background:radial-gradient(ellipse 36% 62% at 50% 52%,rgba(0,0,0,.6),rgba(0,0,0,.28) 60%,transparent 85%)}
html::after,body::after{display:none}
main{padding-top:clamp(18px,5vh,56px)}
}
.bgfill{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(1) blur(36px) brightness(.45);transform:scale(1.15);opacity:.9;pointer-events:none;z-index:0}
@media (max-height:560px){.steps{display:none}}
</style>
</head>
